services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blotato
      POSTGRES_PASSWORD: blotato
      POSTGRES_DB: blotato_comments
    # 55432 on the host so a locally installed Postgres does not shadow it.
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blotato -d blotato_comments']
      interval: 5s
      timeout: 5s
      retries: 10
